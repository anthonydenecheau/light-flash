[workspace]
resolver = "2"
members = [
    "firmware/light-flash",
    "firmware/hardware-check",
    "crates/light-core",
    "crates/rgb-led",
    "crates/wifi",
    "crates/storage",
    "crates/http-server",
    "crates/improv",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV alignée sur le nightly épinglé (rustc 1.85.0-nightly). Avec
# resolver.incompatible-rust-versions = "fallback" (.cargo/config.toml), cargo choisit des
# versions de dépendances compatibles au lieu des plus récentes.
rust-version = "1.84"

# Une seule version de chaque dépendance pour tout le workspace.
# Les versions exactes sont figées par Cargo.lock, qui est commité.
[workspace.dependencies]
anyhow       = "1.0"
log          = "0.4"
rgb          = "0.8"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
esp-idf-svc  = "0.51"
embedded-svc = "0.28"
esp-idf-hal  = { version = "0.45", features = ["rmt-legacy"] }
esp32-nimble = "0.10"
embuild      = "0.33"
toml-cfg     = "0.1"
flate2       = "1"
base64       = "0.22"

light-core  = { path = "crates/light-core" }
rgb-led     = { path = "crates/rgb-led" }
wifi        = { path = "crates/wifi" }
storage     = { path = "crates/storage" }
http-server = { path = "crates/http-server" }
improv      = { path = "crates/improv" }

# Les profils ne sont pris en compte qu'à la racine du workspace.
[profile.release]
opt-level = "s"

[profile.dev]
debug     = true # les symboles n'augmentent pas la taille en flash
opt-level = "z"
